<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CardPay Suite — Learn Payment Processing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset="1" stop-color="#0b111c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#0ea5c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop offset="0" stop-color="rgba(47,111,235,0.35)"/>
      <stop offset="1" stop-color="rgba(47,111,235,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand row -->
  <g transform="translate(90, 96)">
    <rect x="0" y="0" width="64" height="44" rx="8" fill="url(#accent)"/>
    <rect x="0" y="14" width="64" height="9" fill="rgba(5,7,12,0.65)"/>
    <text x="86" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">CardPay Suite</text>
  </g>

  <!-- headline -->
  <text x="90" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="#f8fafc">Master the Art of</text>
  <text x="90" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="url(#accent)">Payment Processing</text>

  <!-- subhead -->
  <text x="92" y="452" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="500" fill="#9fb0c9">Interactive guides, a live transaction simulator &amp; free developer tools.</text>

  <!-- topic chips -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#cdd8ea">
    <g transform="translate(90, 512)">
      <rect x="0" y="0" width="176" height="56" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(47,111,235,0.5)"/>
      <text x="88" y="36" text-anchor="middle">ISO 8583</text>
    </g>
    <g transform="translate(286, 512)">
      <rect x="0" y="0" width="176" height="56" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(47,111,235,0.5)"/>
      <text x="88" y="36" text-anchor="middle">EMV TLV</text>
    </g>
    <g transform="translate(482, 512)">
      <rect x="0" y="0" width="196" height="56" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(47,111,235,0.5)"/>
      <text x="98" y="36" text-anchor="middle">ISO 20022</text>
    </g>
  </g>
</svg>
