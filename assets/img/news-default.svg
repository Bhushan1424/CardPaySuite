<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Placeholder shown when a GNews article has no usable image. -->
  <defs>
    <linearGradient id="nd-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#0ea5c8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#0b111c"/>
  <!-- CardPay Suite Card-C mark, same geometry as favicon.svg (64-unit space, scaled 1.5x) -->
  <g transform="translate(352 130) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="url(#nd-tile)"/>
    <path d="M45 17 H21 a7 7 0 0 0 -7 7 v16 a7 7 0 0 0 7 7 h24"
          fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <rect x="22" y="27" width="10" height="8" rx="2" fill="#f8fafc" opacity="0.85"/>
  </g>
  <text x="400" y="272" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="22" font-weight="600" fill="#8a94a6">Fintech News Radar</text>
  <text x="400" y="300" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="14" fill="#5a6474">Image unavailable</text>
</svg>
