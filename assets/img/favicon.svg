      <stop offset="0" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#0ea5c8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cps-tile)"/>
  <path d="M45 17 H21 a7 7 0 0 0 -7 7 v16 a7 7 0 0 0 7 7 h24"
        fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
